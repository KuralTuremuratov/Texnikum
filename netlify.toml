[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # CSP: разрешаем только безопасные источники
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://aohkenbmaavhwvadwyqc.supabase.co https://upload.imagekit.io https://api.imagekit.io https://ik.imagekit.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# HTTPS Redirect (принудительно)
[[redirects]]
  from = "http://texnikumdemo.netlify.app/*"
  to = "https://texnikumdemo.netlify.app/:splat"
  status = 301
  force = true
